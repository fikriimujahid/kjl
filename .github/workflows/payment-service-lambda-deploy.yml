name: Payment Service Lambda Deploy

on:
  push:
    branches: [dev, prod]
    paths:
      - backend/services/payment-service/**
      - backend/packages/**
      - backend/tsconfig.base.json
      - backend/package.json
      - backend/package-lock.json
      - .github/workflows/payment-service-lambda-deploy.yml

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy-payment-service-lambda:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build --workspace payment-service

      - name: Package Lambda
        run: |
          if [ ! -d services/payment-service/build/lambda ]; then
            echo "Expected services/payment-service/build/lambda directory is missing."
            exit 1
          fi

          rm -f payment-service-lambda.zip
          cd services/payment-service/build/lambda
          zip -r ../../../../payment-service-lambda.zip .

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-lambda
          path: backend/services/payment-service/payment-service-lambda.zip
          if-no-files-found: error

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ github.ref_name == 'prod' && secrets.AWS_PROD_ROLE_ARN || secrets.AWS_DEV_ROLE_ARN }}

      - name: Create Lambda env file
        run: |
          DYNAMO_DB_TABLE_NAME="${{ secrets.PAYMENT_SERVICE_DYNAMO_DB_TABLE_NAME }}"
          MIDTRANS_SERVER_KEY="${{ secrets.PAYMENT_SERVICE_MIDTRANS_SERVER_KEY }}"
          MIDTRANS_SNAP_API_URL="${{ secrets.PAYMENT_SERVICE_MIDTRANS_SNAP_API_URL }}"
          APP_BASE_URL="${{ secrets.PAYMENT_SERVICE_APP_BASE_URL }}"

          if [ -z "${DYNAMO_DB_TABLE_NAME}" ]; then
            echo "DYNAMO_DB_TABLE_NAME is missing. Set vars.DYNAMO_DB_TABLE_NAME or secrets.DYNAMO_DB_TABLE_NAME."
            exit 1
          fi

          if [ -z "${MIDTRANS_SERVER_KEY}" ]; then
            echo "MIDTRANS_SERVER_KEY is missing. Set vars.MIDTRANS_SERVER_KEY or secrets.MIDTRANS_SERVER_KEY."
            exit 1
          fi

          cat > .env.lambda <<EOF
          DYNAMO_DB_TABLE_NAME=${DYNAMO_DB_TABLE_NAME}
          MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY}
          MIDTRANS_SNAP_API_URL=${MIDTRANS_SNAP_API_URL}
          APP_BASE_URL=${APP_BASE_URL}
          EOF

      - name: Update Lambda environment variables
        env:
          LAMBDA_FUNCTION_NAME: ${{ secrets.PAYMENT_SERVICE_LAMBDA_FUNCTION_NAME }}
        run: |
          if [ -z "${LAMBDA_FUNCTION_NAME}" ]; then
            echo "PAYMENT_SERVICE_LAMBDA_FUNCTION_NAME secret is missing."
            exit 1
          fi

          set -a
          source ./.env.lambda
          set +a

          CURRENT_ENV_VARS=$(aws lambda get-function-configuration \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --query 'Environment.Variables' \
            --output json)

          UPDATED_ENV_VARS=$(echo "${CURRENT_ENV_VARS}" | jq -c \
            --arg dynamoDbTableName "${DYNAMO_DB_TABLE_NAME}" \
            --arg midtransServerKey "${MIDTRANS_SERVER_KEY}" \
            --arg midtransSnapApiUrl "${MIDTRANS_SNAP_API_URL}" \
            --arg appBaseUrl "${APP_BASE_URL}" \
            '. + {
              DYNAMO_DB_TABLE_NAME: $dynamoDbTableName,
              MIDTRANS_SERVER_KEY: $midtransServerKey,
              MIDTRANS_SNAP_API_URL: $midtransSnapApiUrl,
              APP_BASE_URL: $appBaseUrl
            }')

          UPDATE_PAYLOAD=$(jq -cn \
            --arg functionName "${LAMBDA_FUNCTION_NAME}" \
            --argjson variables "${UPDATED_ENV_VARS}" \
            '{FunctionName: $functionName, Environment: {Variables: $variables}}')

          aws lambda update-function-configuration \
            --cli-input-json "${UPDATE_PAYLOAD}"

          aws lambda wait function-updated \
            --function-name "${LAMBDA_FUNCTION_NAME}"

      - name: Deploy Lambda code
        env:
          LAMBDA_FUNCTION_NAME: ${{ secrets.PAYMENT_SERVICE_LAMBDA_FUNCTION_NAME }}
        run: |
          if [ -z "${LAMBDA_FUNCTION_NAME}" ]; then
            echo "PAYMENT_SERVICE_LAMBDA_FUNCTION_NAME secret is missing."
            exit 1
          fi

          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --zip-file fileb://payment-service-lambda.zip
