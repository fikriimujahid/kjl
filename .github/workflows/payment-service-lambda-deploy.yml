name: Payment Service Lambda Deploy

on:
  push:
    branches: [dev, prod]
    paths:
      - backend/payment-service/**
      - .github/workflows/payment-service-lambda-deploy.yml

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy-payment-service-lambda:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: backend/payment-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Package Lambda
        run: |
          if [ ! -d lambda ]; then
            echo "Expected lambda directory is missing."
            exit 1
          fi

          rm -f payment-service-lambda.zip
          cd lambda
          zip -r ../payment-service-lambda.zip .

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-lambda
          path: backend/payment-service/payment-service-lambda.zip
          if-no-files-found: error

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ github.ref_name == 'prod' && secrets.AWS_PROD_ROLE_ARN || secrets.AWS_DEV_ROLE_ARN }}

      - name: Create Lambda env file
        run: |
          DYNAMO_DB_TABLE_NAME="${{ vars.DYNAMO_DB_TABLE_NAME }}"
          MIDTRANS_SERVER_KEY="${{ vars.MIDTRANS_SERVER_KEY }}"
          MIDTRANS_IS_PRODUCTION="${{ vars.MIDTRANS_IS_PRODUCTION }}"
          PRODUCT_DATA_URL="${{ vars.PRODUCT_DATA_URL }}"
          APP_BASE_URL="${{ vars.APP_BASE_URL }}"
          MIDTRANS_SNAP_API_URL="${{ vars.MIDTRANS_SNAP_API_URL }}"

          if [ -z "${DYNAMO_DB_TABLE_NAME}" ]; then
            DYNAMO_DB_TABLE_NAME="${{ secrets.DYNAMO_DB_TABLE_NAME }}"
          fi

          if [ -z "${MIDTRANS_SERVER_KEY}" ]; then
            MIDTRANS_SERVER_KEY="${{ secrets.MIDTRANS_SERVER_KEY }}"
          fi

          if [ -z "${MIDTRANS_IS_PRODUCTION}" ]; then
            MIDTRANS_IS_PRODUCTION="${{ github.ref_name == 'prod' && 'true' || 'false' }}"
          fi

          if [ -z "${PRODUCT_DATA_URL}" ]; then
            PRODUCT_DATA_URL="${{ secrets.PRODUCT_DATA_URL }}"
          fi

          if [ -z "${PRODUCT_DATA_URL}" ]; then
            PRODUCT_DATA_URL="https://kjl.fikri.dev/public-data/product.json"
          fi

          if [ -z "${APP_BASE_URL}" ]; then
            APP_BASE_URL="${{ secrets.APP_BASE_URL }}"
          fi

          if [ -z "${APP_BASE_URL}" ]; then
            APP_BASE_URL="${{ github.ref_name == 'prod' && 'https://kejepangdulu.click' || 'https://kjl.fikri.dev' }}"
          fi

          if [ -z "${DYNAMO_DB_TABLE_NAME}" ]; then
            echo "DYNAMO_DB_TABLE_NAME is missing. Set vars.DYNAMO_DB_TABLE_NAME or secrets.DYNAMO_DB_TABLE_NAME."
            exit 1
          fi

          if [ -z "${MIDTRANS_SERVER_KEY}" ]; then
            echo "MIDTRANS_SERVER_KEY is missing. Set vars.MIDTRANS_SERVER_KEY or secrets.MIDTRANS_SERVER_KEY."
            exit 1
          fi

          cat > .env.lambda <<EOF
          DYNAMO_DB_TABLE_NAME=${DYNAMO_DB_TABLE_NAME}
          MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY}
          MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION}
          PRODUCT_DATA_URL=${PRODUCT_DATA_URL}
          APP_BASE_URL=${APP_BASE_URL}
          MIDTRANS_SNAP_API_URL=${MIDTRANS_SNAP_API_URL}
          EOF

      - name: Update Lambda environment variables
        env:
          LAMBDA_FUNCTION_NAME: ${{ secrets.PAYMENT_SERVICE_LAMBDA_FUNCTION_NAME }}
        run: |
          if [ -z "${LAMBDA_FUNCTION_NAME}" ]; then
            echo "PAYMENT_SERVICE_LAMBDA_FUNCTION_NAME secret is missing."
            exit 1
          fi

          set -a
          source ./.env.lambda
          set +a

          CURRENT_ENV_VARS=$(aws lambda get-function-configuration \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --query 'Environment.Variables' \
            --output json)

          UPDATED_ENV_VARS=$(echo "${CURRENT_ENV_VARS}" | jq -c \
            --arg dynamoDbTableName "${DYNAMO_DB_TABLE_NAME}" \
            --arg midtransServerKey "${MIDTRANS_SERVER_KEY}" \
            --arg midtransIsProduction "${MIDTRANS_IS_PRODUCTION}" \
            --arg productDataUrl "${PRODUCT_DATA_URL}" \
            --arg appBaseUrl "${APP_BASE_URL}" \
            --arg midtransSnapApiUrl "${MIDTRANS_SNAP_API_URL}" \
            '. + {
              DYNAMO_DB_TABLE_NAME: $dynamoDbTableName,
              MIDTRANS_SERVER_KEY: $midtransServerKey,
              MIDTRANS_IS_PRODUCTION: $midtransIsProduction,
              PRODUCT_DATA_URL: $productDataUrl,
              APP_BASE_URL: $appBaseUrl
            }
            | if $midtransSnapApiUrl == "" then del(.MIDTRANS_SNAP_API_URL) else . + {MIDTRANS_SNAP_API_URL: $midtransSnapApiUrl} end')

          UPDATE_PAYLOAD=$(jq -cn \
            --arg functionName "${LAMBDA_FUNCTION_NAME}" \
            --argjson variables "${UPDATED_ENV_VARS}" \
            '{FunctionName: $functionName, Environment: {Variables: $variables}}')

          aws lambda update-function-configuration \
            --cli-input-json "${UPDATE_PAYLOAD}"

          aws lambda wait function-updated \
            --function-name "${LAMBDA_FUNCTION_NAME}"

      - name: Deploy Lambda code
        env:
          LAMBDA_FUNCTION_NAME: ${{ secrets.PAYMENT_SERVICE_LAMBDA_FUNCTION_NAME }}
        run: |
          if [ -z "${LAMBDA_FUNCTION_NAME}" ]; then
            echo "PAYMENT_SERVICE_LAMBDA_FUNCTION_NAME secret is missing."
            exit 1
          fi

          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --zip-file fileb://payment-service-lambda.zip
