name: Frontend Deploy
on:
  push:
    branches: [dev, prod]
    paths:
      - frontend/web/**
      - .github/workflows/frontend-deploy.yml

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

# CONCURRENCY: Prevents multiple deployments from running simultaneously
# If a new deployment starts, it cancels any previously running deployments
concurrency:
  group: deploy-frontend-${{ github.ref_name }}         # Group by branch name
  cancel-in-progress: true                       # Cancel old jobs in this group

jobs:
  deploy:
    runs-on: ubuntu-latest                        # Run on Ubuntu (GitHub-hosted runner)
    
    # ENVIRONMENT SELECTION: map branch names to explicit environment names
    environment: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
    
    # PERMISSIONS: Allow this workflow to assume AWS roles (OIDC authentication)
    permissions:
      id-token: write                             # Allow JWT token generation for AWS
      contents: read                              # Allow reading repository content
    
    # DEFAULTS: Apply to all steps in this job unless overridden
    defaults:
      run:
        working-directory: frontend/web               # All commands run in /frontend/web directory
    steps:
      # STEP 1: Clone the repository code onto the runner
      - uses: actions/checkout@v4
      
      # STEP 2: Install Node.js (the runtime that powers frontend tools)
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*                    # Use latest Long-Term Support version

      # STEP 3: Create .env.local file with secrets from GitHub
      # These secrets are sensitive values stored in GitHub (not committed to git)
      - name: Create .env.local
        run: |
          cat <<'EOF' > .env.local
          NEXT_PUBLIC_PRODUCT_URL=${{ secrets.PRODUCT_DATA_URL }}
          NEXT_API_BASE_URL=${{ secrets.NEXT_API_BASE_URL }}
          NEXT_PUBLIC_COGNITO_API_ENDPOINT=${{ secrets.NEXT_PUBLIC_COGNITO_API_ENDPOINT }}
          NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID=${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID }}
          NEXT_PUBLIC_AUTH_STORAGE_KEY=${{ secrets.NEXT_PUBLIC_AUTH_STORAGE_KEY }}
          EOF
      
      # STEP 4: Authenticate with AWS using OIDC (OpenID Connect)
      # This is more secure than storing AWS keys in secrets
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          # Select AWS role based on environment (branch)
          # prod → prod role | others → dev role
          role-to-assume: ${{ github.ref_name == 'prod' && secrets.AWS_PROD_ROLE_ARN || secrets.AWS_DEV_ROLE_ARN }}
      
      # STEP 5: Install project dependencies
      # Uses npm ci (clean install) if lock file exists (recommended for CI)
      # Falls back to npm install if no lock file
      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      
      # STEP 6: Build the frontend as a static Next.js export
      # Next writes static export output to 'out'.
      - name: Build static site
        run: npm run export

      # STEP 7: Resolve deployment target and fail fast if bucket is wrong/missing
      - name: Resolve deploy target
        run: |
          BUCKET_NAME="${PROJECT_NAME}-${GITHUB_REF_NAME}-frontend-bucket"
          echo "BUCKET_NAME=$BUCKET_NAME" >> "$GITHUB_ENV"
          aws s3api head-bucket --bucket "$BUCKET_NAME"
      
      # STEP 8: Upload built files to AWS S3 bucket
      - name: Sync to S3
        run: |
          if [ ! -d out ]; then
            echo "Build output directory 'out' not found."
            exit 1
          fi

          # --delete removes files from S3 that are no longer in the export output
          aws s3 sync out "s3://${BUCKET_NAME}" --delete

      # STEP 9: Ensure HTML is not cached aggressively (faster visible updates)
      - name: Set cache-control for HTML
        run: |
          aws s3 cp out "s3://${BUCKET_NAME}" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      # STEP 10: Invalidate CloudFront so users see latest deployment immediately
      - name: Invalidate CloudFront cache
        run: |
          if [ -z "${CLOUDFRONT_DISTRIBUTION_ID}" ]; then
            echo "CLOUDFRONT_DISTRIBUTION_ID secret is empty or not set"
            exit 1
          fi

          aws cloudfront get-distribution --id "${CLOUDFRONT_DISTRIBUTION_ID}" > /dev/null
          aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"