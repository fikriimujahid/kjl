name: Learning Service Lambda Deploy

on:
  push:
    branches: [dev, prod]
    paths:
      - backend/services/learning-service/**
      - backend/packages/**
      - backend/tsconfig.base.json
      - backend/package.json
      - backend/package-lock.json
      - .github/workflows/learning-service-lambda-deploy.yml

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy-learning-service-lambda:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
    env:
      ZIP_FILE: learning-service-lambda.zip

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build --workspace learning-service

      - name: Package Lambda
        run: |
          if [ ! -d services/learning-service/build/lambda ]; then
            echo "Expected services/learning-service/build/lambda directory is missing."
            exit 1
          fi

          rm -f "${ZIP_FILE}"
          cd services/learning-service/build/lambda
          zip -r "../../../../${ZIP_FILE}" .

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: learning-service-lambda
          path: backend/${{ env.ZIP_FILE }}
          if-no-files-found: error

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ github.ref_name == 'prod' && secrets.AWS_PROD_ROLE_ARN || secrets.AWS_DEV_ROLE_ARN }}

      - name: Create Lambda env file
        env:
          DYNAMO_DB_TABLE_NAME: ${{ secrets.LEARNING_SERVICE_DYNAMO_DB_TABLE_NAME }}
          MEDIA_PRIVATE_BUCKET_NAME: ${{ secrets.MEDIA_PRIVATE_BUCKET_NAME }}
          PAYMENT_SERVICE_INTERNAL_API_BASE_URL: ${{ secrets.LEARNING_SERVICE_PAYMENT_SERVICE_INTERNAL_API_BASE_URL }}
          PAYMENT_SERVICE_INTERNAL_SERVICE_API_KEY: ${{ secrets.PAYMENT_SERVICE_INTERNAL_SERVICE_API_KEY }}
        run: |
          if [ -z "${DYNAMO_DB_TABLE_NAME}" ]; then
            echo "DYNAMO_DB_TABLE_NAME is missing. Set vars.LEARNING_SERVICE_DYNAMO_DB_TABLE_NAME or secrets.LEARNING_SERVICE_DYNAMO_DB_TABLE_NAME."
            exit 1
          fi

          if [ -z "${MEDIA_PRIVATE_BUCKET_NAME}" ]; then
            echo "MEDIA_PRIVATE_BUCKET_NAME is missing. Set vars.MEDIA_PRIVATE_BUCKET_NAME or secrets.MEDIA_PRIVATE_BUCKET_NAME."
            exit 1
          fi

          if [ -z "${PAYMENT_SERVICE_INTERNAL_API_BASE_URL}" ]; then
            echo "PAYMENT_SERVICE_INTERNAL_API_BASE_URL is missing. Set vars.LEARNING_SERVICE_PAYMENT_SERVICE_INTERNAL_API_BASE_URL or secrets.LEARNING_SERVICE_PAYMENT_SERVICE_INTERNAL_API_BASE_URL."
            exit 1
          fi

          if [ -z "${PAYMENT_SERVICE_INTERNAL_SERVICE_API_KEY}" ]; then
            echo "PAYMENT_SERVICE_INTERNAL_SERVICE_API_KEY is missing. Set vars.LEARNING_SERVICE_PAYMENT_SERVICE_INTERNAL_SERVICE_API_KEY or secrets.LEARNING_SERVICE_PAYMENT_SERVICE_INTERNAL_SERVICE_API_KEY."
            exit 1
          fi

          cat > .env.lambda <<EOF
          DYNAMO_DB_TABLE_NAME=${DYNAMO_DB_TABLE_NAME}
          MEDIA_PRIVATE_BUCKET_NAME=${MEDIA_PRIVATE_BUCKET_NAME}
          PAYMENT_SERVICE_INTERNAL_API_BASE_URL=${PAYMENT_SERVICE_INTERNAL_API_BASE_URL}
          PAYMENT_SERVICE_INTERNAL_SERVICE_API_KEY=${PAYMENT_SERVICE_INTERNAL_SERVICE_API_KEY}
          EOF

      - name: Update Lambda environment variables
        env:
          LAMBDA_FUNCTION_NAME: ${{ secrets.LEARNING_SERVICE_LAMBDA_FUNCTION_NAME }}
          DYNAMO_DB_TABLE_NAME: ${{ secrets.LEARNING_SERVICE_DYNAMO_DB_TABLE_NAME }}
          MEDIA_PRIVATE_BUCKET_NAME: ${{ secrets.MEDIA_PRIVATE_BUCKET_NAME }}
          PAYMENT_SERVICE_INTERNAL_API_BASE_URL: ${{ secrets.LEARNING_SERVICE_PAYMENT_SERVICE_INTERNAL_API_BASE_URL }}
          PAYMENT_SERVICE_INTERNAL_SERVICE_API_KEY: ${{ secrets.PAYMENT_SERVICE_INTERNAL_SERVICE_API_KEY }}
        run: |
          if [ -z "${LAMBDA_FUNCTION_NAME}" ]; then
            echo "LEARNING_SERVICE_LAMBDA_FUNCTION_NAME secret is missing."
            exit 1
          fi

          CURRENT_ENV_VARS=$(aws lambda get-function-configuration \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --query 'Environment.Variables' \
            --output json)

          UPDATED_ENV_VARS=$(echo "${CURRENT_ENV_VARS}" | jq -c \
            --arg dynamoDbTableName "${DYNAMO_DB_TABLE_NAME}" \
            --arg mediaPrivateBucketName "${MEDIA_PRIVATE_BUCKET_NAME}" \
            --arg paymentServiceInternalApiBaseUrl "${PAYMENT_SERVICE_INTERNAL_API_BASE_URL}" \
            --arg paymentServiceInternalServiceApiKey "${PAYMENT_SERVICE_INTERNAL_SERVICE_API_KEY}" \
            '. + {
              DYNAMO_DB_TABLE_NAME: $dynamoDbTableName,
              MEDIA_PRIVATE_BUCKET_NAME: $mediaPrivateBucketName,
              PAYMENT_SERVICE_INTERNAL_API_BASE_URL: $paymentServiceInternalApiBaseUrl,
              PAYMENT_SERVICE_INTERNAL_SERVICE_API_KEY: $paymentServiceInternalServiceApiKey
            }')

          UPDATE_PAYLOAD=$(jq -cn \
            --arg functionName "${LAMBDA_FUNCTION_NAME}" \
            --argjson variables "${UPDATED_ENV_VARS}" \
            '{FunctionName: $functionName, Environment: {Variables: $variables}}')

          aws lambda update-function-configuration \
            --cli-input-json "${UPDATE_PAYLOAD}"

          aws lambda wait function-updated \
            --function-name "${LAMBDA_FUNCTION_NAME}"

      - name: Deploy Lambda code
        env:
          LAMBDA_FUNCTION_NAME: ${{ secrets.LEARNING_SERVICE_LAMBDA_FUNCTION_NAME }}
        run: |
          if [ -z "${LAMBDA_FUNCTION_NAME}" ]; then
            echo "LEARNING_SERVICE_LAMBDA_FUNCTION_NAME secret is missing."
            exit 1
          fi

          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --zip-file "fileb://${ZIP_FILE}"