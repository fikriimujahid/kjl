name: Payment Service Lambda CI
on:
  pull_request:
    branches: [dev, prod]
    paths:
      - backend/payment-service/**
      - .github/workflows/payment-service-lambda-ci.yml
      - .github/workflows/payment-service-lambda-deploy.yml
jobs:
  payment-service-lambda-ci:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
    defaults:
      run:
        working-directory: backend/payment-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build TypeScript
        run: npm run build