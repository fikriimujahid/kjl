name: Payment Service Lambda CI
on:
  pull_request:
    branches: [dev, prod]
    paths:
      - backend/payment-service/**
      - .github/workflows/payment-service-lambda-ci.yml
      - .github/workflows/payment-service-lambda-deploy.yml
jobs:
  payment-service-lambda-ci:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
    defaults:
      run:
        working-directory: backend/payment-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Create .env.lambda
        run: |
          cat <<'EOF' > .env.lambda
          DYNAMO_DB_TABLE_NAME=${{ secrets.DYNAMO_DB_TABLE_NAME }}
          MIDTRANS_SERVER_KEY=${{ secrets.MIDTRANS_SERVER_KEY }}
          MIDTRANS_IS_PRODUCTION=${{ secrets.MIDTRANS_IS_PRODUCTION }}
          PRODUCT_DATA_URL=${{ secrets.PRODUCT_DATA_URL }}
          APP_BASE_URL=${{ secrets.APP_BASE_URL }}
          MIDTRANS_SNAP_API_URL=${{ secrets.MIDTRANS_SNAP_API_URL }}
          EOF
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build TypeScript
        run: npm run build
      - name: Validate Lambda env update payload
        run: |
          set -a
          source ./.env.lambda
          set +a

          if [ -z "${DYNAMO_DB_TABLE_NAME}" ]; then
            echo "DYNAMO_DB_TABLE_NAME is missing in .env.lambda"
            exit 1
          fi

          if [ -z "${MIDTRANS_SERVER_KEY}" ]; then
            echo "MIDTRANS_SERVER_KEY is missing in .env.lambda"
            exit 1
          fi

          CURRENT_ENV_VARS='{}'
          UPDATED_ENV_VARS=$(echo "${CURRENT_ENV_VARS}" | jq -c \
            --arg dynamoDbTableName "${DYNAMO_DB_TABLE_NAME}" \
            --arg midtransServerKey "${MIDTRANS_SERVER_KEY}" \
            --arg midtransIsProduction "${MIDTRANS_IS_PRODUCTION}" \
            --arg productDataUrl "${PRODUCT_DATA_URL}" \
            --arg appBaseUrl "${APP_BASE_URL}" \
            --arg midtransSnapApiUrl "${MIDTRANS_SNAP_API_URL}" \
            '. + {
              DYNAMO_DB_TABLE_NAME: $dynamoDbTableName,
              MIDTRANS_SERVER_KEY: $midtransServerKey,
              MIDTRANS_IS_PRODUCTION: $midtransIsProduction,
              PRODUCT_DATA_URL: $productDataUrl,
              APP_BASE_URL: $appBaseUrl
            }
            | if $midtransSnapApiUrl == "" then del(.MIDTRANS_SNAP_API_URL) else . + {MIDTRANS_SNAP_API_URL: $midtransSnapApiUrl} end')

          UPDATE_PAYLOAD=$(jq -cn \
            --arg functionName "validation-dummy-lambda" \
            --argjson variables "${UPDATED_ENV_VARS}" \
            '{FunctionName: $functionName, Environment: {Variables: $variables}}')

          echo "${UPDATE_PAYLOAD}" | jq -e '.FunctionName and .Environment and .Environment.Variables.DYNAMO_DB_TABLE_NAME and .Environment.Variables.MIDTRANS_SERVER_KEY'
      - name: Package Lambda
        run: |
          if [ ! -d lambda ]; then
            echo "Expected lambda directory is missing."
            exit 1
          fi

          rm -f payment-service-lambda.zip
          cd lambda
          zip -r ../payment-service-lambda.zip .
      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-lambda-pr
          path: backend/payment-service/payment-service-lambda.zip
          if-no-files-found: error
