name: Product Service Lambda Deploy

on:
  push:
    branches: [dev, prod]
    paths:
      - backend/product-service/**
      - .github/workflows/product-service-lambda-deploy.yml

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  
jobs:
  deploy-product-service-lambda:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/product-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Package Lambda
        run: |
          if [ ! -d build/lambda ]; then
            echo "Expected build/lambda directory is missing."
            exit 1
          fi

          rm -f product-service-lambda.zip
          cd build/lambda
          zip -r ../../product-service-lambda.zip .

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-service-lambda
          path: backend/product-service/product-service-lambda.zip
          if-no-files-found: error

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          # Select AWS role based on environment (branch)
          # prod → prod role | others → dev role
          role-to-assume: ${{ github.ref_name == 'prod' && secrets.AWS_PROD_ROLE_ARN || secrets.AWS_DEV_ROLE_ARN }}

      - name: Deploy Lambda code
        env:
          LAMBDA_FUNCTION_NAME: ${{ secrets.PRODUCT_SERVICE_LAMBDA_FUNCTION_NAME }}
        run: |
          if [ -z "${LAMBDA_FUNCTION_NAME}" ]; then
            echo "PRODUCT_SERVICE_LAMBDA_FUNCTION_NAME secret is missing."
            exit 1
          fi

          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --zip-file fileb://product-service-lambda.zip
