name: Product Service Lambda Deploy

on:
  push:
    branches: [dev, prod]
    paths:
      - backend/services/product-service/**
      - backend/packages/**
      - backend/tsconfig.base.json
      - backend/package.json
      - backend/package-lock.json
      - .github/workflows/product-service-lambda-deploy.yml

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy-product-service-lambda:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build --workspace product-service

      - name: Package Lambda
        run: |
          if [ ! -d services/product-service/build/lambda ]; then
            echo "Expected services/product-service/build/lambda directory is missing."
            exit 1
          fi

          rm -f product-service-lambda.zip
          cd services/product-service/build/lambda
          zip -r ../../../../product-service-lambda.zip .

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-service-lambda
          path: backend/product-service-lambda.zip
          if-no-files-found: error

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          # Select AWS role based on environment (branch)
          # prod -> prod role | others -> dev role
          role-to-assume: ${{ github.ref_name == 'prod' && secrets.AWS_PROD_ROLE_ARN || secrets.AWS_DEV_ROLE_ARN }}

      - name: Create Lambda env file
        run: |
          DYNAMO_DB_TABLE_NAME="${{ secrets.PRODUCT_SERVICE_DYNAMO_DB_TABLE_NAME }}"
          MEDIA_PRIVATE_BUCKET_NAME="${{ secrets.MEDIA_PRIVATE_BUCKET_NAME }}" 

          if [ -z "${MEDIA_PRIVATE_BUCKET_NAME}" ]; then
            echo "MEDIA_PRIVATE_BUCKET_NAME is missing. Set vars.MEDIA_PRIVATE_BUCKET_NAME or secrets.MEDIA_PRIVATE_BUCKET_NAME."
            exit 1
          fi

          cat > .env.lambda <<EOF
          DYNAMO_DB_TABLE_NAME=${DYNAMO_DB_TABLE_NAME}
          MEDIA_PRIVATE_BUCKET_NAME=${MEDIA_PRIVATE_BUCKET_NAME}
          EOF

      - name: Update Lambda environment variables
        env:
          LAMBDA_FUNCTION_NAME: ${{ secrets.PRODUCT_SERVICE_LAMBDA_FUNCTION_NAME }}
        run: |
          if [ -z "${LAMBDA_FUNCTION_NAME}" ]; then
            echo "PRODUCT_SERVICE_LAMBDA_FUNCTION_NAME secret is missing."
            exit 1
          fi

          set -a
          source ./.env.lambda
          set +a

          CURRENT_ENV_VARS=$(aws lambda get-function-configuration \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --query 'Environment.Variables' \
            --output json)

          UPDATED_ENV_VARS=$(echo "${CURRENT_ENV_VARS}" | jq -c \
            --arg dynamoDbTableName "${DYNAMO_DB_TABLE_NAME}" \
            --arg mediaPrivateBucketName "${MEDIA_PRIVATE_BUCKET_NAME}" \
            '. + {DYNAMO_DB_TABLE_NAME: $dynamoDbTableName, MEDIA_PRIVATE_BUCKET_NAME: $mediaPrivateBucketName}')

          UPDATE_PAYLOAD=$(jq -cn \
            --arg functionName "${LAMBDA_FUNCTION_NAME}" \
            --argjson variables "${UPDATED_ENV_VARS}" \
            '{FunctionName: $functionName, Environment: {Variables: $variables}}')

          aws lambda update-function-configuration \
            --cli-input-json "${UPDATE_PAYLOAD}"

          aws lambda wait function-updated \
            --function-name "${LAMBDA_FUNCTION_NAME}"

      - name: Deploy Lambda code
        env:
          LAMBDA_FUNCTION_NAME: ${{ secrets.PRODUCT_SERVICE_LAMBDA_FUNCTION_NAME }}
        run: |
          if [ -z "${LAMBDA_FUNCTION_NAME}" ]; then
            echo "PRODUCT_SERVICE_LAMBDA_FUNCTION_NAME secret is missing."
            exit 1
          fi

          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --zip-file fileb://product-service-lambda.zip
