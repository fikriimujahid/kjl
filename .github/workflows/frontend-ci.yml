name: Frontend CI
on:
  pull_request:
    branches: [dev, prod]
    paths:
      - frontend/web/**
      - .github/workflows/frontend-ci.yml
      - .github/workflows/frontend-deploy.yml
  # push:
  #   branches: ["feature/**"]
  #   paths: ["frontend/**"]
jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Create .env.local
        run: |
          PRODUCT_URL="${{ secrets.NEXT_PUBLIC_PRODUCT_URL }}"
          
          cat <<EOF > .env.local
          NEXT_PUBLIC_PRODUCT_URL=$PRODUCT_URL
          EOF
      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Validate static export
        run: npm run export
      #- run: npm run lint
      #- run: npm run test